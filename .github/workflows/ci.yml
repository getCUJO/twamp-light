name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ valgrind libcmocka-dev
      - name: Configure
        run: cmake -S . -B build -DRUN_TESTS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        # Unit tests only for now: the shell/valgrind integration tests are slow and simple_qoo_test fails with cmocka 2.0 (Ubuntu 26.04): qoo-c's variance is slightly negative, so the standard deviation is NaN
        run: ctest --test-dir build --output-on-failure -R '^(test_utils|test_packets|test_packetlist)$'
