name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ valgrind libcmocka-dev
      - name: Configure
        run: cmake -S . -B build -DRUN_TESTS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        # qoo-c's sqa_stats_test_1M_samples gets a NaN standard deviation on the runner (negative variance from rounding)
        run: ctest --test-dir build --output-on-failure -E simple_qoo_test
